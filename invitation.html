<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가족식 청첩장</title>
<style>
  @font-face {
    font-family: "Gowun Batang";
    src: url("fonts/GowunBatang-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  :root {
    --paper: #FBF8F1;   /* 밝은 아이보리 */
    --ink: #3A322C;     /* 짙은 회갈색 (인쇄 대비 강화) */
    --ink-soft: #6A6057;
    --canvas: #E9E6E0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--canvas);
    font-family: "Gowun Batang", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  /* 인쇄 시 획이 얇게 뜨지 않도록 살짝 굵게 */
  .card { -webkit-text-stroke: 0.22px currentColor; }
  .sheet {
    display: flex; flex-wrap: wrap; gap: 14mm;
    justify-content: center; padding: 14mm 8mm;
  }
  .side-label {
    font-size: 8pt; letter-spacing: .2em; color: var(--ink-soft);
    text-align: center; margin-bottom: 4mm;
  }
  .card {
    width: 105mm; height: 157mm;
    background: var(--paper);
    outline: .2mm solid #D9D3C8;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    word-break: keep-all;
  }

  /* ── 앞면 ── */
  .front { padding: 38mm 11mm 25mm; }
  .poem {
    font-size: 10.5pt; line-height: 2.05; letter-spacing: -.01em;
  }
  .poet {
    margin-top: 3.5mm;
    font-size: 7.5pt; letter-spacing: .05em; color: var(--ink-soft);
  }
  .front .body {
    margin-top: 17.5mm;
    font-size: 10.5pt; line-height: 2.05;
  }
  .front.long { padding: 25mm 14mm 22mm; }
  .front.long .poem { font-size: 9.6pt; line-height: 1.95; }
  .front.long .body { margin-top: 14mm; }
  .front.full { padding: 17mm 14mm 17mm; }
  .front.full .poem { font-size: 9pt; line-height: 1.72; }
  .front.full .poet { margin-top: 3mm; }
  .front.full .body { margin-top: 9mm; margin-bottom: 9mm; }
  .front .body p + p { margin-top: 4.2mm; }
  .date {
    margin-top: auto;
    font-size: 10.5pt; letter-spacing: .14em;
  }

  /* ── 뒷면 ── */
  .back { padding: 36mm 11mm 34mm; }
  .back .body {
    font-size: 10.5pt; line-height: 2.05;
  }
  .back .body p + p { margin-top: 5mm; }
  .back .family { margin-top: auto; }
  .family {
    display: grid; grid-template-columns: auto auto auto;
    column-gap: 1.6mm; row-gap: 2.6mm; align-items: baseline;
    font-size: 8.6pt;
  }
  .family .parents { text-align: right; letter-spacing: .04em; }
  .family .rel { text-align: left; font-size: 7.6pt; color: var(--ink-soft); }
  .family .child { text-align: left; font-size: 9.6pt; letter-spacing: .12em; padding-left: 1mm; }

  @page { size: 105mm 157mm; margin: 0; }
  @media print {
    body { background: none; }
    .sheet { display: block; padding: 0; }
    .side-label { display: none; }
    .card { outline: none; page-break-after: always; }
  }
</style>
</head>
<body>
<div class="sheet">

  <!-- 앞면 -->
  <section>
    <div class="side-label">FRONT</div>
    <div class="card front">
      <div class="poem">
        문득 아름다운 것과 마주쳤을 때<br>
        지금 곁에 있었으면 얼마나 좋을까 하고<br>
        떠오르는 얼굴이 있다면 그대는<br>
        사랑하고 있는 것이다
      </div>
      <div class="poet">이문재의 「농담」 중</div>

      <div class="body">
        <p>아름다운 것 앞에서<br>늘 서로를 떠올리던 저희가<br>이제 함께 살아가려 합니다.</p>
      </div>

      <div class="date">2026년 11월 8일</div>
    </div>
  </section>

  <!-- 뒷면 -->
  <section>
    <div class="side-label">BACK</div>
    <div class="card back">
      <div class="body">
        <p>직계가족과 함께 작은 예식을 올립니다.</p>
        <p>모두 모시지 못하는 아쉬움과<br>감사의 마음을 담아 소식을 전합니다.</p>
        <p>보내주신 마음 간직하며 다정히 살겠습니다.</p>
      </div>

      <div class="family">
        <span class="parents">김진호 · 박금옥</span><span class="rel">의 아들</span><span class="child">김성기</span>
        <span class="parents">공병익 · 김정자</span><span class="rel">의 딸</span><span class="child">공바르미</span>
      </div>
    </div>
  </section>

</div>
</body>
</html>
