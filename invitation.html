<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가족식 청첩장</title>
<style>
  @font-face {
    font-family: "Gowun Batang";
    src: url("fonts/GowunBatang-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  :root {
    --paper: #FBF8F1;   /* 밝은 아이보리 */
    --ink: #4A423B;     /* 짙은 회갈색 */
    --ink-soft: #857A70;
    --canvas: #E9E6E0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--canvas);
    font-family: "Gowun Batang", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .sheet {
    display: flex; flex-wrap: wrap; gap: 14mm;
    justify-content: center; padding: 14mm 8mm;
  }
  .side-label {
    font-size: 8pt; letter-spacing: .2em; color: var(--ink-soft);
    text-align: center; margin-bottom: 4mm;
  }
  .card {
    width: 110mm; height: 170mm;
    background: var(--paper);
    outline: .2mm solid #D9D3C8;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    word-break: keep-all;
  }

  /* ── 앞면 ── */
  .front { padding: 46mm 14mm 30mm; }
  .poem {
    font-size: 10.5pt; line-height: 2.05; letter-spacing: -.01em;
  }
  .poet {
    margin-top: 3.5mm;
    font-size: 7.5pt; letter-spacing: .12em; color: var(--ink-soft);
  }
  .front .body {
    margin-top: 20mm;
    font-size: 8.6pt; line-height: 2.05;
  }
  .front .body p + p { margin-top: 4.2mm; }
  .date {
    margin-top: auto;
    font-size: 8.6pt; letter-spacing: .16em;
  }

  /* ── 뒷면 ── */
  .back { padding: 44mm 14mm 40mm; }
  .back .body {
    font-size: 8.6pt; line-height: 2.05;
  }
  .back .body p + p { margin-top: 5mm; }
  .back .family { margin-top: auto; }
  .family {
    display: grid; grid-template-columns: auto auto auto;
    column-gap: 1.6mm; row-gap: 2.6mm; align-items: baseline;
    font-size: 8.6pt;
  }
  .family .parents { text-align: right; letter-spacing: .04em; }
  .family .rel { text-align: left; font-size: 7.6pt; color: var(--ink-soft); }
  .family .child { text-align: left; font-size: 9.6pt; letter-spacing: .12em; padding-left: 1mm; }

  @page { size: 110mm 170mm; margin: 0; }
  @media print {
    body { background: none; }
    .sheet { display: block; padding: 0; }
    .side-label { display: none; }
    .card { outline: none; page-break-after: always; }
  }
</style>
</head>
<body>
<div class="sheet">

  <!-- 앞면 -->
  <section>
    <div class="side-label">FRONT</div>
    <div class="card front">
      <div class="poem">
        ‘아픈 내가 당신의 이름을 지어다가<br>
        며칠은 먹었다’
      </div>
      <div class="poet">시인 박준</div>

      <div class="body">
        <p>이제 저희도<br>서로의 이름으로<br>평생을 살아가려 합니다.</p>
      </div>

      <div class="date">2026년 11월 8일</div>
    </div>
  </section>

  <!-- 뒷면 -->
  <section>
    <div class="side-label">BACK</div>
    <div class="card back">
      <div class="body">
        <p>직계가족과 함께 작은 예식을 올립니다.</p>
        <p>모두 모시지 못하는 아쉬움과<br>감사의 마음을 담아 소식을 전합니다.</p>
        <p>보내주신 마음 간직하며 다정히 살겠습니다.</p>
      </div>

      <div class="family">
        <span class="parents">김진호 · 박금옥</span><span class="rel">의 아들</span><span class="child">김성기</span>
        <span class="parents">공병익 · 김정자</span><span class="rel">의 딸</span><span class="child">공바르미</span>
      </div>
    </div>
  </section>

</div>
</body>
</html>
