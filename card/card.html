<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
@page { size: 90mm 120mm; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 90mm; height: 120mm; }
body { background: #ffffff; color: #111111; font-family: "Nanum Myeongjo", serif; display: flex; align-items: center; justify-content: center; }
.card { width: 82mm; height: 112mm; border: .3mm solid #111111; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6mm; }
.eyebrow { font-family: "Cormorant Garamond", serif; font-size: 8pt; letter-spacing: .35em; color: #6e6e6e; }
.brand { font-family: "Cormorant Garamond", serif; font-size: 20pt; letter-spacing: .06em; margin-top: 1.5mm; }
.fr { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 13pt; color: #111111; margin-top: 4mm; }
.line { width: 10mm; height: .3mm; background: #111111; margin: 4mm auto; }
.ko { font-size: 8.5pt; line-height: 1.7; color: #222222; }
img { width: 38mm; height: 38mm; margin-top: 5mm; }
.hint { font-size: 6.5pt; color: #6e6e6e; margin-top: 3mm; }
</style></head><body><div class="card">
<div class="eyebrow">MENU DU DÎNER</div>
<div class="brand">Chez Simon</div>
<div class="fr">Le Dernier Plat</div>
<div class="line"></div>
<div class="ko">오늘의 마지막 코스는<br>아래 QR 코드로 확인해 주세요</div>
<img src="qr.png">
<div class="hint">휴대폰 카메라로 비춰주세요</div>
</div></body></html>
